      html,
      body {
        background-color: #fffdf5;
        color: #2d221e;

        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }

      .font-display {
        font-family: "Jua", "Outfit", sans-serif;
      }

      .font-latin {
        font-family: "Outfit", "Jua", sans-serif;
      }

      .usagi-paper-bg {
        background-color: #fffdf5;
        background-image: radial-gradient(#efe2bd 1.25px, transparent 1.25px);
        background-size: 24px 24px;
      }

      @keyframes usagiFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }

      @keyframes usagiCheer {
        0%,
        100% {
          transform: translateY(0) rotate(-2deg);
        }
        50% {
          transform: translateY(-8px) rotate(2deg);
        }
      }

      @keyframes choiceBounce {
        0% {
          transform: scale(1) translateY(0);
        }
        35% {
          transform: scale(1.04) translateY(-5px);
        }
        70% {
          transform: scale(0.97) translateY(0);
        }
        100% {
          transform: scale(1) translateY(0);
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-usagi-float {
        animation: usagiFloat 2.8s ease-in-out infinite;
      }

      .animate-usagi-cheer {
        animation: usagiCheer 2.2s ease-in-out infinite;
      }

      .animate-choice-bounce {
        animation: choiceBounce 0.24s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .animate-fade-up {
        animation: fadeUp 0.24s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

        const bgPositions = [
          { top: '6%', left: '3%', cls: 'w-20 sm:w-28 -rotate-12 opacity-[0.22]' },
          { top: '12%', right: '4%', cls: 'w-24 sm:w-32 rotate-12 opacity-[0.20]' },
          { top: '46%', left: '2%', cls: 'w-20 sm:w-28 rotate-6 opacity-[0.16]' },
          { top: '52%', right: '3%', cls: 'w-20 sm:w-28 -rotate-6 opacity-[0.18]' },
          { bottom: '6%', left: '5%', cls: 'w-24 sm:w-32 rotate-12 opacity-[0.22]' },
          { bottom: '8%', right: '5%', cls: 'w-20 sm:w-28 -rotate-12 opacity-[0.20]' },
        ];
        const container = document.getElementById('bg-usagi-layer');
        container.innerHTML = bgPositions
          .map((p) => {
            const style = [
              p.top ? `top:${p.top}` : '',
              p.bottom ? `bottom:${p.bottom}` : '',
              p.left ? `left:${p.left}` : '',
              p.right ? `right:${p.right}` : '',

              .filter(Boolean)
              .join(';');
            return `<div style="${style}" class="absolute h-auto ${p.cls}">${renderUsagiImg()}</div>`;
          })
          .join('');
      }

      function calculateMbti(answers) {
        const counts = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
        Object.values(answers).forEach((trait) => {
          counts[trait] += 1;
        });
        return (
          (counts.E >= counts.I ? 'E' : 'I') +
          (counts.S >= counts.N ? 'S' : 'N') +
          (counts.T >= counts.F ? 'T' : 'F') +
          (counts.J >= counts.P ? 'J' : 'P')
        );
      }

                      <p class="mt-0.5 text-[14px] text-[#6B5449] sm:text-[15px]">추천 직업 안내</p>
                    </div>
                    <div>
                      <p class="font-latin text-xl font-bold tabular-nums text-[#2D221E] sm:text-2xl">3유형</p>
                      <p class="mt-0.5 text-[14px] text-[#6B5449] sm:text-[15px]">찰떡 궁합 MBTI</p>
                    </div>
                  </div>

                  <button
                    id="start-btn"
                    type="button"
                    class="flex min-h-[64px] w-full cursor-pointer items-center justify-center gap-2.5 rounded-2xl border-2 border-[#2D221E] bg-[#FFE678] px-6 py-4 font-display text-[22px] text-[#2D221E] shadow-[0_5px_0_#2D221E] transition-transform hover:-translate-y-0.5 hover:bg-[#FFDF54] active:scale-[0.96] sm:min-h-[60px] sm:w-auto sm:min-w-[260px] sm:text-2xl"
                  >
                    <span class="whitespace-nowrap">시작하기</span>
                    <span aria-hidden="true">→</span>
                  </button>
                </div>
              </div>

              <div class="order-1 flex flex-col items-center justify-center rounded-2xl border-2 border-[#2D221E] bg-[#FFF8DC] px-5 py-6 sm:p-8 lg:order-2">
                ${renderUsagiMascot({
                  mood: 'cheer',
                  size: 'lg',
                  speech: '야하! 맛있는 거랑 여행 얘기하자!',
                })}
                <p class="mt-3 text-center text-[15px] font-bold text-[#6B5449] sm:mt-4 sm:text-base">
                  음식 취향 & 여행 스타일로 보는 내 찐 MBTI
                </p>
              </div>
            </div>
          </section>
        `;
      }

      function renderQuestionScreen() {
        const q = QUIZ_QUESTIONS[state.currentIndex];
        const total = QUIZ_QUESTIONS.length;
        const progressPercent = ((state.currentIndex + 1) / total) * 100;
        const selectedTrait = state.answers[q.id];

        return `
          <section class="mx-auto w-full max-w-4xl">
            <div class="mb-4 rounded-2xl border-2 border-[#2D221E] bg-white/95 px-4 py-3.5 shadow-[0_4px_0_#EEDFB8] sm:mb-5 sm:px-6">
              <div class="mb-3 flex items-center justify-between gap-4">
                <button
                  id="prev-btn"
                  type="button"
                  ${state.currentIndex === 0 ? 'disabled' : ''}
                  class="inline-flex min-h-[44px] cursor-pointer items-center gap-1 rounded-xl px-3 py-2 text-[16px] font-bold text-[#5C4940] transition-colors hover:bg-[#FFF8DC] hover:text-[#2D221E] disabled:cursor-not-allowed disabled:opacity-35"
                >
                  <span aria-hidden="true">‹</span>
                  <span class="whitespace-nowrap">이전</span>
                </button>

                <div class="flex items-center gap-2 text-[16px] font-bold text-[#5C4940] sm:text-[17px]">
                  <span>진행률</span>
                  <span aria-hidden="true">·</span>
                  <span class="font-latin text-[19px] font-extrabold tabular-nums text-[#2D221E]">
                    ${state.currentIndex + 1}/${total}
                  </span>
                </div>
              </div>

              <div
                class="relative h-5 w-full overflow-visible rounded-full border-2 border-[#2D221E] bg-[#FFF8DC]"
                role="progressbar"
                aria-valuenow="${state.currentIndex + 1}"
                aria-valuemin="1"
                aria-valuemax="${total}"
              >
                <div
                  style="width: ${progressPercent}%"
                  class="h-full rounded-full bg-[#FF9BB3] transition-all duration-300"
                ></div>
                <div
                  style="left: ${progressPercent}%"
                  class="pointer-events-none absolute top-1/2 -translate-x-1/2 -translate-y-1/2 transition-all duration-300"
                >
                  <div class="flex h-9 w-9 items-center justify-center rounded-full border-2 border-[#2D221E] bg-white p-1 shadow-sm">
                    ${renderUsagiImg()}
                  </div>
                </div>
              </div>
            </div>

            <div class="animate-fade-up rounded-3xl border-2 border-[#2D221E] bg-white/95 p-5 shadow-[0_8px_0_#EEDFB8] sm:p-8 lg:p-10">
              <div class="grid grid-cols-1 items-center gap-5 lg:grid-cols-[0.35fr_0.65fr] lg:gap-8">
                <div class="flex flex-row items-center justify-center gap-4 rounded-2xl border-2 border-[#EFE4CE] bg-[#FFFDF2] px-4 py-3.5 sm:py-4 lg:flex-col lg:py-8">
                  ${renderUsagiMascot({ mood: 'idle', size: 'sm' })}
                  <div class="text-left lg:mt-2 lg:text-center">
                    <p class="text-[14px] font-bold text-[#9C7A68] sm:text-sm">${escapeHtml(q.situation)}</p>
                    <p id="usagi-tip-text" class="mt-1 text-[16px] leading-snug font-bold text-[#2D221E] sm:text-base">
                      ${escapeHtml(q.usagiTip)}
                    </p>
                  </div>
                </div>

                <div class="flex flex-col">
                  <div class="mb-2 flex items-center gap-2 text-[15px] font-bold text-[#8A6D5B] sm:text-base">
                    <span class="font-latin text-[17px] tabular-nums text-[#E26D89]">
                      Q${String(state.currentIndex + 1).padStart(2, '0')}
                    </span>
                    <span aria-hidden="true">·</span>
                    <span>하나만 골라주세요</span>
                  </div>

                  <h2 class="font-display text-[24px] leading-[1.36] text-[#2D221E] sm:text-3xl">
                    ${escapeHtml(q.question)}
                  </h2>

                  <div class="mt-5 flex flex-col gap-4 sm:mt-6">
                    ${q.options
                      .map((opt) => {
                        const isPrev = selectedTrait === opt.trait;
                        return `
                          <button
                            type="button"
                            data-trait="${opt.trait}"
                            class="option-btn group flex min-h-[88px] w-full cursor-pointer items-center gap-4 rounded-2xl border-2 border-[#2D221E] px-4 py-5 text-left transition-all hover:-translate-y-0.5 active:scale-[0.96] sm:min-h-[92px] sm:px-6 ${
                              isPrev
                                ? 'bg-[#FFF3B0] shadow-[0_4px_0_#2D221E]'
                                : 'bg-[#FFFDF8] shadow-[0_4px_0_#EEDFB8] hover:bg-[#FFF8DC] hover:shadow-[0_4px_0_#2D221E]'
                            }"
                          >
                            <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border-2 border-[#2D221E] font-latin text-lg font-extrabold ${
                              isPrev ? 'bg-white text-[#2D221E]' : 'bg-[#FFE678] text-[#2D221E]'
                            }">
                              ${opt.label}
                            </span>
                            <span class="text-[17.5px] leading-[1.45] font-bold text-[#2D221E] sm:text-[19px]">
                              ${escapeHtml(opt.text)}
                            </span>
                          </button>
                        `;
                      })
                      .join('')}
                  </div>
                </div>
              </div>
            </div>
          </section>
        `;
      }

      function renderResultScreen() {
        const r = MBTI_RESULTS[state.resultType] || MBTI_RESULTS.ENFP;

        return `
          <section class="animate-fade-up mx-auto w-full max-w-5xl">
            <div id="result-capture-area" class="space-y-5 rounded-3xl bg-[#FFFDF5] p-2 sm:space-y-6 sm:p-4">
              <div class="grid grid-cols-1 items-stretch gap-5 sm:gap-6 lg:grid-cols-[0.44fr_0.56fr]">
                <div
                  style="background-color: ${r.badgeBg}"
                  class="flex flex-col items-center justify-between rounded-3xl border-2 border-[#2D221E] p-6 text-center shadow-[0_8px_0_#EEDFB8] sm:p-8"
                >
                  <div class="w-full">
                    <p class="text-[15px] font-bold text-[#5C4940] sm:text-base">나의 MBTI 성향 결과</p>
                    <h1 class="mt-1.5 font-latin text-[3.75rem] leading-none font-extrabold tracking-wider text-[#2D221E] sm:text-7xl">
                      ${escapeHtml(r.type)}
                    </h1>
                    <p class="mt-3 font-display text-[26px] leading-snug text-[#2D221E] sm:text-3xl">
                      ${escapeHtml(r.nickname)}
                    </p>
                  </div>

                  <div class="mt-6 mb-2">
                    ${renderUsagiMascot({
                      mood: 'cheer',
                      size: 'md',
                      speech: r.usagiComment,
                    })}
                  </div>

                  <p class="mt-2 text-[14px] font-bold text-[#6B5449]">
                    음식 취향 · 여행 스타일 MBTI 테스트
                  </p>
                </div>

                <div class="flex flex-col justify-between gap-6 rounded-3xl border-2 border-[#2D221E] bg-white p-6 shadow-[0_8px_0_#EEDFB8] sm:p-8">
                  <div>
                    <h2 class="font-display text-[23px] text-[#2D221E] sm:text-2xl">나는 어떤 사람일까?</h2>
                    <div class="mt-4 space-y-3 text-[17px] leading-[1.7] text-[#473831] sm:text-[18px]">
                      ${r.description.map((line) => `<p>${escapeHtml(line)}</p>`).join('')}
                    </div>
                  </div>

                  <div class="border-t border-[#EFE4CE] pt-6">
                    <div class="mb-4 flex items-center gap-2">
                      <span class="text-xl" aria-hidden="true">💼</span>
                      <h2 class="font-display text-[23px] text-[#2D221E] sm:text-2xl">어울리는 직업 3가지</h2>
                    </div>

                    <div class="grid grid-cols-1 gap-3.5">
                      ${r.jobs
                        .map(
                          (job, idx) => `
                          <div class="flex items-start gap-3.5 rounded-2xl border-2 border-[#EFE4CE] bg-[#FFFDF5] p-4">
                            <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border-2 border-[#2D221E] bg-[#FFE678] font-latin text-base font-extrabold tabular-nums text-[#2D221E]">
                              0${idx + 1}
                            </span>
                            <div>
                              <h3 class="text-[18px] font-bold text-[#2D221E] sm:text-[19px]">${escapeHtml(job.title)}</h3>
                              <p class="mt-1 text-[15.5px] leading-[1.55] text-[#6B5449] sm:text-base">${escapeHtml(job.reason)}</p>
                            </div>
                          </div>
                        `
                        )
                        .join('')}
                    </div>
                  </div>
                </div>
              </div>

              <!-- 궁합이 좋은 MBTI 3가지 -->
              <div class="rounded-3xl border-2 border-[#2D221E] bg-white p-6 shadow-[0_8px_0_#EEDFB8] sm:p-8">
                <div class="mb-5 flex items-center gap-2.5">
                  <span class="text-xl" aria-hidden="true">🩷</span>
                  <h2 class="font-display text-[23px] text-[#2D221E] sm:text-2xl">
                    ${escapeHtml(r.type)}와 궁합이 좋은 MBTI 3가지
                  </h2>
                </div>

                <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
                  ${r.compatibleTypes
                    .map(
                      (match) => `
                      <div class="flex flex-col justify-between rounded-2xl border-2 border-[#EFE4CE] bg-[#FFFDF5] p-5">
                        <div>
                          <div class="flex items-baseline gap-2.5">
                            <span class="font-latin text-3xl font-extrabold tracking-wide text-[#2D221E]">${escapeHtml(match.type)}</span>
                            <span class="text-[15px] font-bold text-[#E26D89]">찰떡 궁합</span>
                          </div>
                          <p class="mt-1 font-display text-[19px] text-[#2D221E]">${escapeHtml(match.nickname)}</p>
                        </div>
                        <p class="mt-3 text-[15.5px] leading-[1.55] text-[#5C4940] sm:text-base">${escapeHtml(match.reason)}</p>
                      </div>
                    `
                    )
                    .join('')}
                </div>
              </div>
            </div>

            <!-- 하단 액션 버튼 -->
            <div class="mt-5 px-2 sm:mt-6 sm:px-4">
              <p id="capture-error-msg" class="mb-3 hidden text-center text-[15px] font-bold text-[#B91C1C]"></p>
              <div class="grid grid-cols-1 gap-3.5 sm:grid-cols-3">
                <button
                  id="download-png-btn"
                  type="button"
                  class="flex min-h-[60px] w-full cursor-pointer items-center justify-center gap-2.5 rounded-2xl border-2 border-[#2D221E] bg-[#FFE678] px-5 py-4 font-display text-[19px] text-[#2D221E] shadow-[0_4px_0_#2D221E] transition-transform hover:-translate-y-0.5 hover:bg-[#FFDF54] active:scale-[0.96] sm:text-xl"
                >
                  <span class="whitespace-nowrap">이미지로 저장 (PNG)</span>
                </button>

                <button
                  id="share-btn"
                  type="button"
                  class="flex min-h-[60px] w-full cursor-pointer items-center justify-center gap-2.5 rounded-2xl border-2 border-[#2D221E] bg-white px-5 py-4 font-display text-[19px] text-[#2D221E] shadow-[0_4px_0_#2D221E] transition-transform hover:-translate-y-0.5 hover:bg-[#FFF8DC] active:scale-[0.96] sm:text-xl"
                >
                  <span class="whitespace-nowrap">친구에게 결과 공유하기</span>
                </button>

                <button
                  id="restart-btn"
                  type="button"
                  class="flex min-h-[60px] w-full cursor-pointer items-center justify-center gap-2.5 rounded-2xl border-2 border-[#2D221E] bg-[#2D221E] px-5 py-4 font-display text-[19px] text-white shadow-[0_4px_0_#8A6D5B] transition-transform hover:-translate-y-0.5 hover:bg-[#41332E] active:scale-[0.96] sm:text-xl"
                >
                  <span class="whitespace-nowrap">다시 하기</span>
                </button>
              </div>
            </div>
          </section>
        `;
      }

      function bindEvents() {
        if (state.screen === 'start') {
          document.getElementById('start-btn')?.addEventListener('click', () => {
            state.answers = {};
            state.currentIndex = 0;
            state.screen = 'quiz';
            if (window.location.search) {
              window.history.replaceState({}, '', window.location.pathname);
            }
            render();
          });
        } else if (state.screen === 'quiz') {
          document.getElementById('prev-btn')?.addEventListener('click', () => {
            if (state.currentIndex > 0 && !state.isLocked) {
              state.currentIndex -= 1;
              render();
            }
          });

          document.querySelectorAll('.option-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
              if (state.isLocked) return;
              state.isLocked = true;
              const trait = btn.getAttribute('data-trait');
              const q = QUIZ_QUESTIONS[state.currentIndex];

              btn.classList.remove('bg-[#FFFDF8]', 'bg-[#FFF3B0]', 'shadow-[0_4px_0_#EEDFB8]');
              btn.classList.add('bg-[#FFE678]', 'shadow-[0_5px_0_#2D221E]', 'animate-choice-bounce');
              const tipEl = document.getElementById('usagi-tip-text');
              if (tipEl) tipEl.textContent = '오케이! 다음으로 슝~';

              setTimeout(() => {
                state.answers[q.id] = trait;
                state.isLocked = false;
                if (state.currentIndex + 1 < QUIZ_QUESTIONS.length) {
                  state.currentIndex += 1;
                } else {
                  state.resultType = calculateMbti(state.answers);
                  state.screen = 'result';
                  window.scrollTo({ top: 0, behavior: 'smooth' });
                }
                render();
              }, 260);
            });
          });
        } else if (state.screen === 'result') {
          const r = MBTI_RESULTS[state.resultType] || MBTI_RESULTS.ENFP;

          document.getElementById('download-png-btn')?.addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            const target = document.getElementById('result-capture-area');
            const errEl = document.getElementById('capture-error-msg');
            if (!target || !window.htmlToImage) return;

            btn.disabled = true;
            btn.innerHTML = '<span class="whitespace-nowrap">이미지 만드는 중...</span>';
            errEl.classList.add('hidden');

            try {
              let dataUrl;
              try {
                dataUrl = await window.htmlToImage.toPng(target, {
                  pixelRatio: 2,
                  backgroundColor: '#FFFDF5',
                  cacheBust: true,
                });
              } catch {
                dataUrl = await window.htmlToImage.toPng(target, {
                  pixelRatio: 2,
                  backgroundColor: '#FFFDF5',
                  skipFonts: true,
                });
              }

              const link = document.createElement('a');
              link.download = `MBTI-${r.type}-결과.png`;
              link.href = dataUrl;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);

              btn.innerHTML = '<span class="whitespace-nowrap text-[#15803D]">✓ PNG 저장 완료!</span>';
              setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = '<span class="whitespace-nowrap">이미지로 저장 (PNG)</span>';
              }, 2400);
            } catch {
              errEl.textContent = '이미지 저장 중 문제가 발생했어요. 다시 한 번 눌러주세요.';
              errEl.classList.remove('hidden');
              btn.disabled = false;
              btn.innerHTML = '<span class="whitespace-nowrap">이미지로 저장 (PNG)</span>';
            }
          });

          document.getElementById('share-btn')?.addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            const shareUrl = `${window.location.origin}${window.location.pathname}?result=${r.type}`;
            const shareText = `우사기 MBTI 성향 테스트 해봤어! 내 유형은 "${r.nickname}" (${r.type})래. 너도 해봐!`;

            if (navigator.share) {
              try {
                await navigator.share({
                  title: `내 MBTI 결과는 ${r.type} (${r.nickname})!`,
                  text: shareText,
                  url: shareUrl,
                });
                return;
              } catch {}
            }

            try {
              await navigator.clipboard.writeText(`${shareText}\n${shareUrl}`);
            } catch {
              const ta = document.createElement('textarea');
              ta.value = `${shareText}\n${shareUrl}`;
              ta.style.position = 'fixed';
              ta.style.opacity = '0';
              document.body.appendChild(ta);
              ta.select();
              document.execCommand('copy');
              document.body.removeChild(ta);
            }

            btn.innerHTML = '<span class="whitespace-nowrap text-[#15803D]">✓ 링크가 복사되었어요!</span>';
            setTimeout(() => {
              btn.innerHTML = '<span class="whitespace-nowrap">친구에게 결과 공유하기</span>';
            }, 2400);
          });

          document.getElementById('restart-btn')?.addEventListener('click', resetToStart);
        }
      }

      function resetToStart() {
        state.answers = {};
        state.currentIndex = 0;
        state.screen = 'start';
        state.isLocked = false;
        if (window.location.search) {
          window.history.replaceState({}, '', window.location.pathname);
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      }

      function render() {
        updateHeader();
        const app = document.getElementById('app');
        if (state.screen === 'start') {
          app.innerHTML = renderStartScreen();
        } else if (state.screen === 'quiz') {
          app.innerHTML = renderQuestionScreen();
        } else {
          app.innerHTML = renderResultScreen();
        }
        bindEvents();
      }

      document.getElementById('header-title-btn').addEventListener('click', resetToStart);
      document.getElementById('header-reset-btn').addEventListener('click', resetToStart);

      const params = new URLSearchParams(window.location.search);
      const sharedType = params.get('result')?.toUpperCase();
      if (sharedType && MBTI_RESULTS[sharedType]) {
        state.resultType = sharedType;
        state.screen = 'result';
      }

      initBackgroundUsagis();
      render();
    </script>
  </body>
</html>
